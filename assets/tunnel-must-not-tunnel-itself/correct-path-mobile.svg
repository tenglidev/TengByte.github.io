<path d="M314 541 L320 550 L326 541" fill="none" stroke="#416c82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="65" y="550" width="510" height="70" rx="7" fill="#e8f0f4"/>
<text x="320" y="593" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#416c82" text-anchor="middle">Route B outside this VPN</text>
