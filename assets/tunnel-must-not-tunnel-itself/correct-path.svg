<text x="30" y="614" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="400" fill="#6b7d72" text-anchor="start">The outer packet leaves A. B unwraps it and forwards the original packet.</text>
