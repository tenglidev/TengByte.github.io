<rect x="770" y="456" width="140" height="105" rx="8" fill="#fff" stroke="#d9e1d9" stroke-width="1.5"/>
<text x="130" y="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="550" fill="#253b33" text-anchor="middle">Wi-Fi</text>
