<rect x="30" y="25" width="900" height="310" rx="10" fill="#fff" stroke="#d9e1d9" stroke-width="1.5"/>
<text x="55" y="66" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="550" fill="#6b7d72" text-anchor="start">INSIDE LAPTOP A</text>
<rect x="55" y="100" width="220" height="100" rx="7" fill="#eaf0e4"/>
<rect x="365" y="100" width="230" height="100" rx="7" fill="#f5f7f2"/>
