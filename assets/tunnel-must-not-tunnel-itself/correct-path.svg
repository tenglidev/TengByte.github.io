<text x="165" y="141" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#38785e" text-anchor="middle">Original packet</text>
<text x="165" y="179" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#253b33" text-anchor="middle">To: the website</text>
<text x="480" y="141" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="29" font-weight="550" fill="#253b33" text-anchor="middle">VPN</text>
<text x="480" y="179" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#6b7d72" text-anchor="middle">Encrypt + wrap</text>
<text x="795" y="141" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#416c82" text-anchor="middle">Outer packet</text>
<text x="795" y="179" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#253b33" text-anchor="middle">To: B</text>
