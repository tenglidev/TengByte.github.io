<text x="610" y="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="550" fill="#253b33" text-anchor="middle">Server B</text>
<text x="610" y="539" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#6b7d72" text-anchor="middle">Unwrap + decrypt</text>
<text x="840" y="500" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="26" font-weight="550" fill="#253b33" text-anchor="middle">Website</text>
