<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="t d"><title id="t">Correct: the outer packet takes the existing network</title><desc id="d">Laptop A wraps the original packet, then routes the outer packet addressed to B over its existing network. B unwraps and forwards the original packet to the website.</desc>
