<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" viewBox="0 0 640 600" role="img" aria-labelledby="t d"><title id="t">A packet inside a packet</title><desc id="d">The outer packet is addressed to VPN server B. Its encrypted payload contains the original packet, still addressed to the website. Protocol details omitted.</desc>
<rect x="0" y="0" width="640" height="600" rx="0" fill="#f5f7f2"/>
<rect x="25" y="30" width="590" height="525" rx="10" fill="#e8f0f4" stroke="#b7cbd5" stroke-width="1.5"/>
<text x="50" y="81" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="550" fill="#416c82" text-anchor="start">OUTER PACKET</text>
<text x="50" y="132" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="33" font-weight="400" fill="#253b33" text-anchor="start">To: VPN server B</text>
<rect x="50" y="174" width="540" height="351" rx="8" fill="#eaf0e4" stroke="#bdcdb6" stroke-width="1.5"/>
<text x="75" y="219" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#38785e" text-anchor="start">Encrypted contents</text>
<rect x="75" y="245" width="490" height="250" rx="7" fill="#fff" stroke="#d9e1d9" stroke-width="1.5"/>
<text x="100" y="291" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="550" fill="#38785e" text-anchor="start">ORIGINAL PACKET</text>
<text x="100" y="345" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="32" font-weight="400" fill="#253b33" text-anchor="start">To: the website</text>
<text x="100" y="402" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#6b7d72" text-anchor="start">Data for the website</text>
<text x="100" y="452" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#6b7d72" text-anchor="start">Original address preserved</text>
</svg>