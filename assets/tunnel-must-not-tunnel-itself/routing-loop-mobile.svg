<svg xmlns="http://www.w3.org/2000/svg" width="640" height="725" viewBox="0 0 640 725" role="img" aria-labelledby="t d"><title id="t">Wrong: the outer packet goes back into the same VPN</title><desc id="d">Incorrect routing sends the new outer packet into the same VPN again. The dependency loops instead of delivering the transport packet to B.</desc>
<rect x="0" y="0" width="640" height="725" rx="0" fill="#f5f7f2"/>
<rect x="50" y="35" width="440" height="115" rx="8" fill="#eaf0e4" stroke="#d9e1d9" stroke-width="1.5"/>
<rect x="50" y="230" width="440" height="115" rx="8" fill="#fff" stroke="#d9e1d9" stroke-width="1.5"/>
<rect x="50" y="425" width="440" height="115" rx="8" fill="#e8f0f4" stroke="#d9e1d9" stroke-width="1.5"/>
<text x="270" y="80" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#38785e" text-anchor="middle">Original packet</text>
<text x="270" y="122" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#253b33" text-anchor="middle">To: the website</text>
<text x="270" y="275" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="33" font-weight="550" fill="#253b33" text-anchor="middle">VPN</text>
<text x="270" y="317" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#6b7d72" text-anchor="middle">Encrypt + wrap</text>
<text x="270" y="470" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="30" font-weight="550" fill="#416c82" text-anchor="middle">New outer packet</text>
<text x="270" y="512" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#253b33" text-anchor="middle">To: B</text>
<path d="M270 150 V230" fill="none" stroke="#416c82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M264 221 L270 230 L276 221" fill="none" stroke="#416c82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M270 345 V425" fill="none" stroke="#416c82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M264 416 L270 425 L276 416" fill="none" stroke="#416c82" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M490 483 H585 V287 H490" fill="none" stroke="#b44f41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M499 281 L490 287 L499 293" fill="none" stroke="#b44f41" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="30" y="604" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="550" fill="#b44f41" text-anchor="start">Wrong route: back into the same VPN</text>
<text x="30" y="652" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#b44f41" text-anchor="start">Wrap again → route again → repeat</text>
<text x="30" y="699" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#6b7d72" text-anchor="start">The packet never gets delivered to B.</text>
</svg>