<rect x="0" y="0" width="640" height="1260" rx="0" fill="#101f25"/>
<rect width="640" height="1260" fill="url(#grid)" opacity=".33"/>
<text x="48" y="58" fill="#b4e5c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="start">01 / MANAGEMENT SETUP</text>
<text x="48" y="114" fill="#eef5f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" text-anchor="start">One address.</text>
<text x="48" y="165" fill="#eef5f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" text-anchor="start">Two responders.</text>
