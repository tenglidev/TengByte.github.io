<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1260" viewBox="0 0 640 1260" role="img" aria-labelledby="title desc">
<title id="title">One address. Two responders.</title><desc id="desc">Mobile layout of the management topology. A laptop uses Wi-Fi to a gateway and direct Ethernet to an OpenWrt LAN port, with the same example subnet and peer address on both links.</desc>
