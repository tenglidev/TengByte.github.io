<text x="48" y="499" fill="#92c8e7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="400" text-anchor="start">192.168.1.0/24</text>
<text x="48" y="770" fill="#f3bc89" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start">USB Ethernet / direct cable</text>
<text x="48" y="807" fill="#f3bc89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="400" text-anchor="start">192.168.1.0/24</text>
