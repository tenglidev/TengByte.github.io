<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" role="img" aria-labelledby="t d"><title id="t">Two packet paths</title><desc id="d">A board request follows local output policy. An overlay packet follows forwarding policy. The tunnel needed zone membership and an explicit forwarding rule.</desc>
<rect x="0" y="0" width="960" height="530" rx="0" fill="#f5f7f2"/>
<text x="30" y="42" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="600" fill="#38785e" text-anchor="start">LOCALLY GENERATED</text>
<text x="30" y="275" font-family="ui-monospace, Menlo, monospace" font-size="18" font-weight="600" fill="#a96937" text-anchor="start">FORWARDED FROM OVERLAY</text>
<rect x="30" y="77" width="230" height="123" rx="7" fill="#fff" stroke="#d9e1d9" stroke-width="1.5"/>
<text x="49" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#253b33" text-anchor="start">Board request</text>
<text x="49" y="169" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7d72" text-anchor="start">Locally generated</text>
<rect x="365" y="77" width="230" height="123" rx="7" fill="#fff" stroke="#d9e1d9" stroke-width="1.5"/>
<text x="384" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#253b33" text-anchor="start">OUTPUT</text>
<text x="384" y="169" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7d72" text-anchor="start">Local output policy</text>
<rect x="700" y="77" width="230" height="123" rx="7" fill="#fff" stroke="#d9e1d9" stroke-width="1.5"/>
<text x="719" y="125" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#253b33" text-anchor="start">LAN / upstream</text>
<text x="719" y="169" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7d72" text-anchor="start">Request succeeds</text>
