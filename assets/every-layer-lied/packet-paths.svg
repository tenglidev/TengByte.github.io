<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Two different packet paths</title><desc id="desc">Board-originated traffic traverses an output path. Overlay traffic being forwarded crosses forwarding policy. An unassigned tunnel was blocked; assigning its zone and allowing forwarding formed part of the working configuration.</desc>
<defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#263b42" stroke-width="1"/></pattern></defs>
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#101f25"/>
<rect width="1200" height="760" fill="url(#grid)" opacity=".33"/>
<text x="64" y="56" fill="#b4e5c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" font-weight="600" text-anchor="start">02 / THE FORWARDING PROBLEM</text>
<text x="64" y="107" fill="#eef5f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="42" font-weight="700" text-anchor="start">Same board. Different packet paths.</text>
<text x="64" y="149" fill="#a5b9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">A successful package download only exercised the board’s own outbound path.</text>
<text x="64" y="207" fill="#b4e5c6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="start">BOARD-ORIGINATED TRAFFIC</text>
<rect x="64" y="238" width="260" height="124" rx="16" fill="#192b32" stroke="#344a52" stroke-width="2"/>
<text x="88" y="287" fill="#eef5f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">Board request</text>
<text x="88" y="329" fill="#a5b9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Locally generated</text>
<rect x="398" y="238" width="304" height="124" rx="16" fill="#192b32" stroke="#344a52" stroke-width="2"/>
<text x="422" y="287" fill="#eef5f3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="600" text-anchor="start">OUTPUT</text>
<text x="422" y="329" fill="#a5b9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Local output policy</text>
<rect x="824" y="238" width="306" height="124" rx="16" fill="#192b32" stroke="#344a52" stroke-width="2"/>
<text x="848" y="287" fill="#eef5f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">LAN / upstream</text>
<text x="848" y="329" fill="#a5b9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Request succeeds</text>
<path d="M324 300 H398" fill="none" stroke="#b4e5c6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M388 293 L398 300 L388 307" fill="none" stroke="#b4e5c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M702 300 H824" fill="none" stroke="#b4e5c6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M814 293 L824 300 L814 307" fill="none" stroke="#b4e5c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="64" y="427" fill="#f3bc89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="600" text-anchor="start">TRAFFIC FORWARDED THROUGH THE BOARD</text>
<rect x="64" y="466" width="260" height="164" rx="16" fill="#192b32" stroke="#344a52" stroke-width="2"/>
<text x="88" y="519" fill="#eef5f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start">Overlay packet</text>
<text x="88" y="562" fill="#a5b9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Tunnel ingress</text>
<text x="88" y="601" fill="#92c8e7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Counters move</text>
<rect x="398" y="466" width="304" height="164" rx="16" fill="#192b32" stroke="#79604b" stroke-width="2"/>
<text x="422" y="510" fill="#eef5f3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27" font-weight="600" text-anchor="start">FORWARD</text>
<circle cx="426" cy="550" r="5" fill="#f38e7e"/>
<text x="443" y="558" fill="#f38e7e" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">Before: no zone</text>
<circle cx="426" cy="592" r="5" fill="#b4e5c6"/>
<text x="443" y="600" fill="#b4e5c6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">After: zone + rule</text>
<rect x="824" y="466" width="306" height="164" rx="16" fill="#192b32" stroke="#344a52" stroke-width="2"/>
<text x="848" y="520" fill="#eef5f3" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="27" font-weight="600" text-anchor="start">LAN egress</text>
<text x="848" y="562" fill="#a5b9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Application works</text>
<text x="848" y="601" fill="#a5b9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start">after configuration</text>
<path d="M324 548 H398" fill="none" stroke="#92c8e7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M388 541 L398 548 L388 555" fill="none" stroke="#92c8e7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M702 548 H824" fill="none" stroke="#b4e5c6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M814 541 L824 548 L814 555" fill="none" stroke="#b4e5c6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="719" y="518" fill="#b4e5c6" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start">after fix</text>
<rect x="64" y="675" width="1066" height="46" rx="9" fill="#203139"/>
<text x="84" y="706" fill="#a5b9bf" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">Zone, forwarding, masquerading, and MSS settings were changed together.</text>
