<text x="719" y="357" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#253b33" text-anchor="start">LAN egress</text>
<text x="719" y="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7d72" text-anchor="start">Application works</text>
<rect x="365" y="310" width="230" height="153" rx="7" fill="#fff8ee" stroke="#dcc9ae" stroke-width="1.5"/>
