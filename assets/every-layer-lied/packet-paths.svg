<text x="30" y="507" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7d72" text-anchor="start">Masquerading and MSS settings changed in the same configuration pass.</text>
