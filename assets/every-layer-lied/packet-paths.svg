<path d="M692 133 L700 138 L692 143" fill="none" stroke="#38785e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="30" y="310" width="230" height="153" rx="7" fill="#fff" stroke="#d9e1d9" stroke-width="1.5"/>
<text x="49" y="357" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#253b33" text-anchor="start">Overlay packet</text>
<text x="49" y="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#6b7d72" text-anchor="start">Tunnel ingress</text>
